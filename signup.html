<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login_signup.css">
    <link rel="stylesheet" href="responsive.css">
    <title>Sign Up - TechNova</title>
</head>
<body class="login-page">
    <!--Nav Bar Code-->
    <div class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="bi bi-rocket-takeoff-fill"></i>
                <span>TechNova</span>
            </a>
            <div class="btn1-2">
                <a href="login.html"><i class="bi bi-person"></i></a>
                <a href="index.html"><i class="bi bi-cart3"></i></a>
            </div>
        </div>
    </div>

    <!--Signup Section-->
    <section class="login-section">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h1>Create Account</h1>
                    <p>Sign up to get started with TechNova</p>
                </div>

                <form class="login-form" id="signupForm">
                    <div class="form-group">
                        <label for="fullName">
                            <i class="bi bi-person"></i>
                            Full Name
                        </label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="bi bi-envelope"></i>
                            Email Address
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="bi bi-lock"></i>
                            Password
                        </label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Create a password"
                                required
                                minlength="8"
                            >
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="bi bi-lock-fill"></i>
                            Confirm Password
                        </label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm your password"
                                required
                            >
                            <button type="button" class="password-toggle" id="confirmPasswordToggle">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options signup-options">
                        <label class="remember-me">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="login-btn">
                        <span>Create Account</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn google-btn">
                            <i class="bi bi-google"></i>
                            <span>Continue with Google</span>
                        </button>
                        <button type="button" class="social-btn facebook-btn">
                            <i class="bi bi-facebook"></i>
                            <span>Continue with Facebook</span>
                        </button>
                    </div>

                    <div class="signup-link">
                        <p>Already have an account? <a href="login.html">Sign in</a></p>
                    </div>
                </form>
            </div>

            <div class="login-back-link">
                <a href="index.html">
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </section>

    <script>
        // Password toggle functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = passwordToggle.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });

        confirmPasswordToggle.addEventListener('click', () => {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            
            const icon = confirmPasswordToggle.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });

        // Form validation
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                confirmPasswordInput.focus();
                return;
            }
            
            if (password.length < 8) {
                alert('Password must be at least 8 characters long!');
                passwordInput.focus();
                return;
            }
            
            // Add your signup logic here
            console.log('Signup form submitted');
            alert('Account created successfully!');
        });
    </script>
</body>
</html>
